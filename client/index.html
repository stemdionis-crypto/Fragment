<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fragment</title>
    <meta name="description" content="A 3-4 player puzzle where an old radio listens to everything you say." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=PT+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Hand-drawn "boiling line" filter, animated from main.ts -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <main id="app"></main>
    <div id="grain" aria-hidden="true"></div>
    <div id="static" aria-hidden="true"></div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
